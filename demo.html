<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SeTuJu Simulator</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root { --bg:#0b1118; --panel:#141e29; --text:#eef3f8; --muted:#8fa2b5; --accent:#33ccff; --gag:#ff3b6b; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { display:flex; height:100%; gap:16px; padding:16px; }
  .sim { flex:1; display:flex; flex-direction:column; gap:12px; min-width:0; }
  .stage { flex:1; position:relative; border-radius:18px; overflow:hidden; background:#87b7e0; min-height:300px; }
  /* driver's view: 3D map underneath, street photo on top when one exists for this spot */
  #fp { position:absolute; inset:0; background:linear-gradient(#5d9ee0 0%, #a9d0f2 45%, #dfeaf2 60%); }
  .chip.btn { cursor:pointer; border:0; color:var(--text); font:inherit; font-weight:700; font-size:14px; }
  .photo { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .35s; }
  .photo.show { opacity:1; }
  .hood { position:absolute; left:-5%; right:-5%; bottom:-40px; height:120px; background:radial-gradient(ellipse at 50% 0%, #2b3440 0%, #0d1218 70%); border-radius:50% 50% 0 0; box-shadow:0 -6px 20px #0008; }
  .freshener { position:absolute; top:-4px; left:62%; font-size:34px; transform-origin:top center; animation:swing 2.2s ease-in-out infinite; }
  @keyframes swing { 0%,100% { transform:rotate(-10deg); } 50% { transform:rotate(12deg); } }
  .vlight { position:absolute; top:150px; right:16px; display:none; align-items:center; gap:10px; background:#000c; padding:10px 14px; border-radius:14px; font-weight:800; font-size:28px; }
  .vlight .bulb { width:34px; height:34px; border-radius:50%; box-shadow:0 0 18px currentColor; }
  .vhaz { position:absolute; left:50%; transform:translate(-50%,-50%); pointer-events:none; filter:drop-shadow(0 6px 8px #0009); }
  .overlay { position:absolute; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; gap:8px; font-weight:800; font-size:26px; text-align:center; }
  .overlay.show { display:flex; }
  #seaView { background:linear-gradient(#5aa9e6, #1e6fb8 55%, #124a80); font-size:28px; }
  #seaView .boat { font-size:110px; animation:swing 1.6s ease-in-out infinite; }
  #thinkView { background:#000b; }
  .pip { position:absolute; left:14px; bottom:14px; width:220px; height:260px; border-radius:14px; overflow:hidden; border:2px solid #fff3; box-shadow:0 8px 24px #000a; }
  .pip canvas { width:100%; height:100%; display:block; }
  .hud { position:absolute; top:12px; left:12px; display:flex; gap:8px; flex-wrap:wrap; }
  .chip { background:#000a; padding:6px 10px; border-radius:10px; font-weight:700; font-size:14px; }
  .keys { position:absolute; right:12px; top:12px; background:#000b; border-radius:12px; padding:8px 12px; font-size:13px; line-height:1.7; }
  .keys kbd { display:inline-block; min-width:22px; text-align:center; background:#fff; color:#111; border-radius:5px; padding:0 5px; font:700 12px system-ui; margin-right:6px; box-shadow:0 2px 0 #999; }
  .junc { position:absolute; left:50%; bottom:96px; transform:translateX(-50%); display:none; gap:6px; align-items:center; background:#000c; border-radius:12px; padding:6px 12px; font-weight:800; font-size:15px; white-space:nowrap; }
  .junc .x { display:inline-block; min-width:30px; text-align:center; font-size:24px; color:#fff9; }
  .junc .x.r { color:#33ccff; }
  .credit { position:absolute; right:10px; bottom:6px; font-size:10px; color:#fffa; text-shadow:0 1px 2px #000; }
  .dash { display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center; background:var(--panel); border-radius:18px; padding:14px; }
  .face { font-size:64px; line-height:1; width:84px; text-align:center; transition:transform .2s; }
  .face.pop { transform:scale(1.25) rotate(-6deg); }
  .who { color:var(--muted); font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; }
  .bubble { background:#fff; color:#111; border-radius:14px; padding:10px 14px; font-size:18px; font-weight:700; position:relative; min-height:46px; margin-top:4px; }
  .bubble::before { content:""; position:absolute; left:-8px; top:16px; border:8px solid transparent; border-right-color:#fff; border-left:0; }
  .speedo { text-align:center; }
  .speedo b { font-size:40px; font-variant-numeric:tabular-nums; display:block; line-height:1; }
  .speedo small { color:var(--muted); }
  .controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .controls .grp { display:flex; gap:6px; background:var(--panel); padding:6px; border-radius:12px; align-items:center; }
  .controls .lbl { color:var(--muted); font-size:12px; padding:0 4px; }
  button { border:0; border-radius:9px; padding:8px 12px; font-size:14px; font-weight:700; cursor:pointer; background:#24313f; color:var(--text); }
  button.on, button.go { background:var(--accent); color:#04121c; }
  button.gag.on { background:var(--gag); color:#fff; }
  .phone-unused { width:390px; flex:none; border-radius:44px; background:#000; padding:14px; box-shadow:0 20px 60px #000c, inset 0 0 0 2px #333; display:flex; }
  .phone iframe { border:0; border-radius:32px; width:100%; height:100%; background:#fff; }
  @media (max-width: 900px) { .wrap { flex-direction:column; height:auto; } .phone { width:100%; height:760px; } .stage { min-height:420px; } .pip { width:150px; height:180px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="sim">
    <div class="stage" id="stage">
      <div id="fp"></div>
      <img class="photo" id="photoA" alt=""><img class="photo" id="photoB" alt="">
      <div id="vhaz"></div>
      <div class="junc" id="junc"></div>
      <div class="hood"><span class="freshener">🌲</span></div>
      <div class="vlight" id="vlight"><div class="bulb" id="vbulb"></div><span id="vsecs"></span></div>
      <div class="overlay" id="seaView"><div class="boat">⛵</div><div id="seaText"></div></div>
      <div class="overlay" id="thinkView"><div id="thinkText"></div></div>
      <div class="pip"><canvas id="cv"></canvas></div>
      <div class="hud"><span class="chip" id="chipLight" hidden></span><span class="chip" id="chipLane">—</span><button class="chip btn" id="chipSrc"></button><button class="chip btn" id="chipTime"></button></div>
      <div class="keys" id="keysLegend"></div>
      <div class="credit" id="credit">Street imagery © KartaView contributors · Map © OpenStreetMap, OpenFreeMap</div>
    </div>
    <div class="dash">
      <div class="face" id="face">😎</div>
      <div><div class="who" id="who"></div><div class="bubble" id="bubble" data-i18n="ready"></div></div>
      <div class="speedo"><b id="kmh">0</b><small data-i18n="kmh"></small></div>
    </div>
    <div class="controls">
      <div class="grp"><button class="go" id="startBtn" data-i18n="start"></button><button id="stopBtn" data-i18n="stop"></button></div>
      <div class="grp"><span class="lbl" data-i18n="drivers"></span>
        <button data-p="grab" class="on">😎 Abang Grab</button>
        <button data-p="rempit">😈 Mat Rempit</button>
        <button data-p="makcik">👵 Makcik Kiah</button>
      </div>
      <div class="grp"><span class="lbl" data-i18n="throw"></span>
        <button data-h="🐄">🐄</button><button data-h="🕳️">🕳️</button><button data-h="🌊">🌊</button><button data-h="🚧">🚧</button><button data-h="👮">👮</button>
      </div>
      <div class="grp"><span class="lbl" data-i18n="laneLbl"></span>
        <button id="laneL" title="Arrow Left">⬅</button><button id="laneR" title="Arrow Right">➡</button>
        <button id="laneAuto" class="on" data-i18n="laneAuto"></button>
      </div>
      <div class="grp"><button id="modeBtn" class="on"></button></div>
      <div class="grp"><button class="gag" id="gagBtn" data-i18n="gagMode"></button></div>
      <div class="grp"><button id="openApp" data-i18n="openApp"></button><span class="lbl" id="appStatus"></span></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

// shortcut: photos are fetched per route around sample points every 150 m (API caps a page at 100); fine for city demo routes, cache/tile it for long trips

  fp.addLayer({ id: 'drv-edge-l', type: 'line', source: 'drv', layout: line, paint: { 'line-color': '#f4f4f4', 'line-width': metres(.15) } }, before);
  fp.addLayer({ id: 'drv-edge-r', type: 'line', source: 'drv', layout: line, paint: { 'line-color': '#f4f4f4', 'line-width': metres(.15) } }, before);
  for (let k = 1; k <= 4; k++) fp.addLayer({ id: 'drv-div-' + k, type: 'line', source: 'drv', layout: line, paint: { 'line-color': '#ffffff', 'line-width': metres(.15), 'line-dasharray': [20, 40] } }, before);
  if (R) drawLanes(true);
});
let drawnLanes = 0;
function drawLanes(force) {
  if (!fp.getSource('drv') || (!force && drawnLanes === lanesN)) return;
  drawnLanes = lanesN;
  const half = lanesN * LANE_M / 2;
  fp.getSource('drv').setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: R.path.map(p => [p.lng, p.lat]) } });
  fp.setPaintProperty('drv-road', 'line-width', metres(lanesN * LANE_M + .8));
  fp.setPaintProperty('drv-edge-l', 'line-offset', metres(-half + .3));
  fp.setPaintProperty('drv-edge-r', 'line-offset', metres(half - .3));
  for (let k = 1; k <= 4; k++) {
    fp.setLayoutProperty('drv-div-' + k, 'visibility', k < lanesN ? 'visible' : 'none');
    if (k < lanesN) fp.setPaintProperty('drv-div-' + k, 'line-offset', metres(-half + k * LANE_M));
  }
}
function driverCamera() {
  const p0 = at(R, D), hd = headingAt(R, D);
  // ease heading so turns sweep instead of snapping; ease lane offset so lane changes glide
  camHdg = (camHdg + (((hd - camHdg + 540) % 360) - 180) * .08 + 360) % 360;
  laneF += (laneIdx - laneF) * .06;
  const eye = offsetLL(p0, camHdg + 90, (laneF - (lanesN - 1) / 2) * LANE_M);
  // MapLibre places the camera behind 'center'; solve zoom for eye height, then push center ahead so the camera sits on the car
  const camPx = fp.getContainer().clientHeight / 2 / Math.tan(fp.transform.fov / 2 * RAD || .3217);
  const z = Math.log2(camPx * Math.cos(PITCH * RAD) / EYE_M * mPerPx0);
  const ahead = camPx * mPerPx0 / 2 ** z * Math.sin(PITCH * RAD);
  const c = offsetLL(eye, camHdg, ahead);
  fp.jumpTo({ center: [c.lng, c.lat], bearing: camHdg + steerYaw, pitch: PITCH, zoom: Math.min(24, z) });
}

// ---------- state from the nav app ----------
let S = null, gag = false, lastLightRed = null;
let lastHeard = 0;
function fromPinned(m) {
  if (!m.inst) return false;
  if (!pinned || performance.now() - lastHeard > 3000) pinned = m.inst;
  if (m.inst !== pinned) return false;
  lastHeard = performance.now(); return true;
}
const appLinked = () => pinned && performance.now() - lastHeard < 3000;
bc.onmessage = ({ data: m }) => {
  if (!fromPinned(m)) return;
  if (m.lang && m.lang !== lang) { lang = m.lang; applyLang(); }
  if (m.t === 'route') { if (!R || R.id !== m.id) setRoute(m); return; }
  if (m.t === 'state') { S = m; gag = m.gag; $('gagBtn').classList.toggle('on', gag); return; }
  if (m.t !== 'event') return;
  gag = m.gag; $('gagBtn').classList.toggle('on', gag);
  const k = m.kind;
  if (k === 'start') { talk(rand(gag ? L().startGag : L().start)); sea = 0; }
  else if (k === 'instr') talk(rand(gag ? L().instrGag : L().instr), null, false);
  else if (k === 'hazard') talk(rand(L().hazard[m.text] || [tr('what')]), 'hazard');
  else if (k === 'sea') { talk(rand(L().sea), 'sea'); sea = Date.now() + 4400; }
  else if (k === 'teleport') talk(tr('teleport')(m.text), 'teleport');
  else if (k === 'arrive') { talk(rand(gag ? L().arriveGag : L().arrive), gag ? 'arriveGag' : 'arrive'); driving = false; }
  else if (k === 'gag') m.text && talk(rand(L().gagOn), 'gagOn');
  else if (k === 'reroute') talk(tr('rerouted'), 'arrive');
  else if (L()[k]) talk(rand(L()[k]), k);
};

// ---------- controls ----------
let appWin = null;
const openApp = () => { appWin = window.open('index.html', 'setuju-app', 'popup,width=420,height=880'); };
$('openApp').onclick = openApp;
$('startBtn').onclick = async () => {
  driving = true; arrived = false;
  if (!appLinked()) { if (!appWin || appWin.closed) openApp(); await new Promise(r => setTimeout(r, 3500)); }
  cmd('start', { from: { name: 'ASB Campus', lat: 3.1550721, lng: 101.6924545 } }); cmd('needRoute');
};
// lane controls: buttons or arrow keys switch to manual; Auto lets the driver follow the app's lane hints
let autoLane = true;
function shiftLane(d) {
  autoLane = false; $('laneAuto').classList.remove('on');
  const to = Math.max(0, Math.min(lanesN - 1, laneIdx + d));
  if (to !== laneIdx) { blink = d; laneIdx = to; }
}
$('laneL').onclick = () => shiftLane(-1);
$('laneR').onclick = () => shiftLane(1);
$('laneAuto').onclick = () => { autoLane = !autoLane; $('laneAuto').classList.toggle('on', autoLane); };
function setManual(on) { manual = on; $('modeBtn').classList.toggle('on', !on); $('modeBtn').textContent = on ? '🕹️ ' + tr('manual') : '🤖 ' + tr('autopilot'); }
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
  if (e.repeat && !['arrowup', 'arrowdown'].includes(k)) return;
  // steering: tap = lane change (on key up), hold = turn onto the next road that way
  if ((k === 'arrowleft' || k === 'arrowright') && !steer) {
    const st = steer = { dir: k === 'arrowleft' ? -1 : 1, t0: performance.now(), turned: false };
    // a timer, not the render loop, decides tap vs hold (frames can be throttled)
    st.timer = setTimeout(() => { if (steer === st) { st.turned = true; takeRoad(st.dir * 90); } }, HOLD_TO_TURN);
  }
  if (k === 'arrowup' || k === 'arrowdown') {
    if (!R) { $('startBtn').onclick(); return; }
    if (k === 'arrowup' && !e.repeat && waitingAt != null) runLight = waitingAt; // stopped at red + fresh ↑ = run the light
    keys[k === 'arrowup' ? 'up' : 'down'] = true; driving = true; arrived = false; setManual(true);
  }
  if (k === 'a') setManual(false);
});
addEventListener('keyup', e => {
  if (e.key === 'ArrowUp') keys.up = false;
  if (e.key === 'ArrowDown') keys.down = false;
  if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && steer) { clearTimeout(steer.timer); if (!steer.turned) shiftLane(steer.dir); steer = null; }
});
let steer = null, steerYaw = 0;
const HOLD_TO_TURN = 450; // ms
function updateSteer() {
  // view swings toward the held direction, then settles back
  const want = steer ? steer.dir * Math.min(25, (performance.now() - steer.t0) / 18) : 0;
  steerYaw += (want - steerYaw) * .12;
}
addEventListener('blur', () => { keys.up = keys.down = false; steer = null; });
$('modeBtn').onclick = () => setManual(!manual);

// Stop only parks the simulated car; the app keeps navigating (end the trip from the app itself)
$('stopBtn').onclick = () => { driving = false; };
$('gagBtn').onclick = () => cmd('gag', { v: !gag });
document.querySelectorAll('[data-h]').forEach(b => b.onclick = () => {
  if (!S) return talk(tr('notStarted'));
  cmd('hazard', { e: b.dataset.h });
});
document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
  persona = b.dataset.p;
  document.querySelectorAll('[data-p]').forEach(x => x.classList.toggle('on', x === b));
  applyLang();
  talk(persona === 'makcik' ? rand(L().makcik) : persona === 'rempit' ? rand(L().laneRempit) : tr('okDrive'));
});

// ---------- bird's-eye picture-in-picture (lane changes) ----------
const cv = $('cv'), ctx = cv.getContext('2d');
const PX_PER_M = 1.4, LANE_W = 52;
let W = 0, H = 0, scroll = 0, lanesN = 3, carX = null, laneIdx = 1, blink = 0, sea = 0, nextZig = 0;
const npcs = Array.from({ length: 5 }, (_, i) => ({ lane: i % 3, y: Math.random() * 300, v: .6 + Math.random() * .5, c: rand(['#f1c40f', '#ecf0f1', '#3498db', '#9b59b6', '#2c3e50']) }));

function resize() {
  const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize); resize();

function laneCenter(i) { const roadW = lanesN * LANE_W; return W / 2 - roadW / 2 + LANE_W * (i + .5); }

function pickLane() {
  const n = lanesN, cur = Math.min(laneIdx, n - 1);
  if (!autoLane) return cur;
  if (persona === 'makcik') return n - 1; // fast lane, slow speed
  if (persona === 'rempit') { if (Date.now() > nextZig) { nextZig = Date.now() + 1200; return Math.floor(Math.random() * n); } return cur; }
  let target = cur;
  const valid = (S?.lanes || []).map((l, i) => l.valid ? i : -1).filter(i => i >= 0);
  if (valid.length && !valid.includes(cur)) target = valid.reduce((a, b) => Math.abs(b - cur) < Math.abs(a - cur) ? b : a);
  // swerve around a hazard in our lane
  const h = (S?.hazards || []).find(h => h.d > 0 && h.d < 160 && h.id % n === target);
  if (h) target = target > 0 ? target - 1 : target + 1;
  return target;
}

function drawCar(x, y, color, me) {
  ctx.save(); ctx.translate(x, y); ctx.scale(.62, .62);
  ctx.fillStyle = '#0006'; ctx.fillRect(-21, -34, 46, 72);
  ctx.fillStyle = color; roundRect(-22, -38, 44, 76, 10); ctx.fill();
  ctx.fillStyle = '#1b2733'; roundRect(-17, -24, 34, 18, 5); ctx.fill(); roundRect(-17, 14, 34, 12, 4); ctx.fill();
  ctx.fillStyle = '#fff6b0'; ctx.fillRect(-18, -40, 9, 4); ctx.fillRect(9, -40, 9, 4);
  if (me && blink && Math.floor(Date.now() / 250) % 2) { ctx.fillStyle = '#ffa500'; const s = blink; ctx.fillRect(s < 0 ? -24 : 16, -38, 8, 8); ctx.fillRect(s < 0 ? -24 : 16, 30, 8, 8); }
  if (me && V < 1) { ctx.fillStyle = '#ff2b2b'; ctx.fillRect(-18, 36, 9, 4); ctx.fillRect(9, 36, 9, 4); }
  ctx.restore();
}
function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }

function drawPip(t, dDist) {
  const carY = H - 50;
  ctx.fillStyle = gag ? '#5a3d6b' : '#3d7a3a'; ctx.fillRect(0, 0, W, H);
  const roadW = lanesN * LANE_W, rx = W / 2 - roadW / 2;
  ctx.fillStyle = '#2d3238'; ctx.fillRect(rx - 6, 0, roadW + 12, H);
  ctx.fillStyle = '#fff'; ctx.fillRect(rx - 4, 0, 3, H); ctx.fillRect(rx + roadW + 1, 0, 3, H);
  ctx.fillStyle = '#ffffffcc';
  for (let i = 1; i < lanesN; i++) for (let y = (scroll % 40) - 40; y < H; y += 40) ctx.fillRect(rx + LANE_W * i - 1.5, y, 3, 20);
  if (S?.lanes) {
    ctx.font = 'bold 20px system-ui'; ctx.textAlign = 'center';
    S.lanes.forEach((l, i) => { ctx.fillStyle = l.valid ? '#33ccffdd' : '#ffffff55'; ctx.fillText(l.indications.map(ind => ({ left:'↰', 'sharp left':'↰', 'slight left':'↖', 'slight right':'↗', right:'↱', 'sharp right':'↱', uturn:'↶' }[ind] || '↑')).join(''), laneCenter(i), (scroll % 200) + 20); });
  }
  npcs.forEach(n => {
    if (n.lane >= lanesN) n.lane = lanesN - 1;
    n.y += dDist * PX_PER_M * (1 - n.v);
    if (n.y > H + 50) { n.y = -50; n.lane = Math.floor(Math.random() * lanesN); }
    if (Math.abs(laneCenter(n.lane) - (carX ?? 0)) > 40 || Math.abs(n.y - carY) > 70) drawCar(laneCenter(n.lane), n.y, n.c, false);
  });
  const lt = S?.light;
  if (lt && lt.d < 150) {
    const y = carY - 30 - lt.d * PX_PER_M;
    ctx.fillStyle = '#fff'; ctx.fillRect(rx, y, roadW, 5);
    ctx.fillStyle = lt.color || '#e74c3c'; ctx.beginPath(); ctx.arc(rx + roadW + 14, y - 8, 7, 0, 7); ctx.fill();
  }
  (S?.hazards || []).forEach(h => { ctx.font = '28px serif'; ctx.textAlign = 'center'; ctx.fillText(h.e, laneCenter(h.id % lanesN), carY - 30 - h.d * PX_PER_M); });
  if (S) {
    const target = pickLane();
    if (target !== laneIdx) {
      blink = target > laneIdx ? 1 : -1;
      if (persona === 'grab' && !(S.hazards || []).length) talk(rand(L().lane), null, false);
      if (persona === 'rempit') talk(rand(L().laneRempit), 'ranRed', false);
      laneIdx = target;
    }
  }
  if (persona === 'makcik' && autoLane) blink = -1; // eternal left signal
  const tx = laneCenter(laneIdx);
  carX = carX == null ? tx : carX + (tx - carX) * .08;
  if (Math.abs(tx - carX) < 2 && !(persona === 'makcik' && autoLane)) blink = 0;
  ctx.save(); ctx.translate(carX, carY); ctx.rotate((tx - carX) * .006); drawCar(0, 0, gag ? '#ff3b6b' : '#e63946', true); ctx.restore();
}

// ---------- driver's-view overlays ----------
const exitArrow = rel => rel < -60 ? '↰' : rel < -25 ? '↖' : rel <= 25 ? '↑' : rel <= 60 ? '↗' : '↱';
function drawJunction() {
  const j = R && !R.detour && (R.junctions || []).find(j => j.at - D > 3 && j.at - D < 250);
  const el = $('junc');
  if (!j) { el.style.display = 'none'; return; }
  el.style.display = 'flex';
  // blue = the app's route, white = other legal exits (hold ← / → to take one)
  el.innerHTML = `${Math.round(j.at - D)} m ` + exitsOf(j).sort((a, b) => a.rel - b.rel).map(e => `<span class="x ${e.route ? 'r' : ''}">${exitArrow(e.rel)}</span>`).join('');
}
function drawView() {
  drawJunction();
  const lt = S?.light;
  if (lt && lt.d < 150) {
    $('vlight').style.display = 'flex'; $('vbulb').style.background = lt.color; $('vbulb').style.color = lt.color; $('vsecs').textContent = lt.secs;
    $('chipLight').hidden = false; $('chipLight').textContent = `🚦 ${Math.round(lt.d)} m`;
    if (V < 1 && !lt.go && lastLightRed !== lt.id) { lastLightRed = lt.id; talk(rand(L().red), 'red'); }
  } else { $('vlight').style.display = 'none'; $('chipLight').hidden = true; }
  // hazards grow as we approach: fake perspective, closer = lower and bigger
  $('vhaz').innerHTML = (S?.hazards || []).filter(h => h.d > 2 && h.d < 200).map(h => {
    const k = 1 - h.d / 200, x = 50 + ((h.id % lanesN) - laneIdx) * 14 * k;
    return `<div class="vhaz" style="top:${48 + 32 * k * k}%;left:${x}%;font-size:${24 + 150 * k * k}px">${h.e}</div>`;
  }).join('');
  $('seaView').classList.toggle('show', Date.now() < sea); $('seaText').textContent = tr('sea');
  $('thinkView').classList.toggle('show', !!(S?.paused && gag)); $('thinkText').textContent = tr('thinking');
}

let lastT = performance.now();
function frame(t) {
  const dt = Math.min(.1, (t - lastT) / 1000); lastT = t;
  const before = D;
  drive(dt);
  const dDist = D - before;
  scroll += dDist * PX_PER_M;
  $('kmh').textContent = Math.round(V);
  const wantN = Math.max(2, Math.min(5, S?.lanes?.length || 3));
  if (wantN !== lanesN) { lanesN = wantN; laneIdx = Math.min(laneIdx, lanesN - 1); }
  if (R) {
    updateSteer();
    drawLanes();
    driverCamera();
    showFrame();
  }
  drawPip(t, dDist);
  drawView();
  $('chipLane').textContent = `${tr('lane')} ${laneIdx + 1}/${lanesN}`;
  $('chipTime').textContent = TIME_SCALE === 1 ? '▶ 1× real time' : `⏩ ${TIME_SCALE}×`;
  $('appStatus').textContent = appLinked() ? '🟢 ' + tr('linked') : '⚪ ' + tr('notLinked');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
applyLang();
</script>
</body>
</html>
